name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # La promesse centrale du produit. Cette étape inspecte le bundle
      # réellement servi et échoue si du code capable d'émettre une requête
      # sortante y est entré, ou si la CSP a disparu de index.html.
      - name: Zéro réseau
        run: pnpm check:network
