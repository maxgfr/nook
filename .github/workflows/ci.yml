name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # The product's central promise. This step inspects the bundle
      # actually served and fails if code capable of emitting a request
      # has got in, or if the CSP has disappeared from index.html.
      - name: Zero network
        run: pnpm check:network

  # Deliberately separate from `verify`: this test drives a real browser and
  # involves waiting on time. A scheduling fluke on the runner
  # must not mask the signal from types, lint and unit tests.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Writes a note in a real browser, reloads, and checks that it
      # is still there — and that the disk holds nothing but ciphertext.
      - name: End to end
        run: pnpm smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
