# Serving Nook from a container.
#
# Deliberately plain. The application's security policy is a `<meta>` element
# inside the HTML — it has to be, because GitHub Pages cannot send headers —
# so nothing here needs to add, rewrite or "improve" it. A server that injected
# its own Content-Security-Policy would combine with the one in the document
# and could only ever make it stricter, which is a good property but a
# surprising place to hide behaviour. It is left alone.

pid /tmp/nginx.pid;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Everything nginx wants to write goes to /tmp, so the image can be run with
  # a read-only root filesystem.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  access_log off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Routing is by URL fragment, which never reaches a server, so there is no
    # history fallback to arrange: every address the application uses is one of
    # the two real documents. A request for anything else really is a 404.
    location / {
      try_files $uri $uri/ =404;
    }

    # The bundle's filenames carry a content hash, so they can be cached
    # forever. The two documents and the service worker must not be: they are
    # how a new version arrives.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location = /sw.js {
      expires -1;
      add_header Cache-Control "no-cache";
    }

    location ~ \.html$ {
      expires -1;
      add_header Cache-Control "no-cache";
    }
  }
}
